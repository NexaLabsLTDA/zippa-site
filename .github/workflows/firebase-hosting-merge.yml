# Publica o site e a API de Conversões no Firebase, a cada push na main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIPPA_WEB_OFFICIAL }}
          channelId: live
          projectId: zippa-web-official

      # API de Conversões -----------------------------------------------------
      # O token da Meta vive no segredo do repositório, nunca no código.
      - name: Credencial do Firebase
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIPPA_WEB_OFFICIAL }}' > "$RUNNER_TEMP/sa.json"

      - name: Token da Meta na função
        env:
          CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          if [ -n "$CAPI_TOKEN" ]; then
            printf 'META_CAPI_TOKEN=%s\n' "$CAPI_TOKEN" > functions/.env
            echo "token injetado"
          else
            echo "aviso: segredo META_CAPI_TOKEN ausente — a função sobe sem token"
          fi

      - name: Dependencias da funcao
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Habilita as APIs que o deploy de função exige
        run: |
          python3 -m pip install --quiet google-auth requests
          TOKEN=$(python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import sys
          import google.auth.transport.requests
          from google.oauth2 import service_account
          creds = service_account.Credentials.from_service_account_file(
              sys.argv[1], scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(google.auth.transport.requests.Request())
          print(creds.token)
          PY
          )
          echo "token com ${#TOKEN} caracteres"
          for api in cloudbilling eventarc run artifactregistry pubsub storage cloudbuild cloudfunctions firebaseextensions; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" \
              "https://serviceusage.googleapis.com/v1/projects/zippa-web-official/services/${api}.googleapis.com:enable")
            echo "${api}.googleapis.com -> HTTP ${code}"
          done
          sleep 20

      - name: Deploy da função de Conversões
        run: npx --yes firebase-tools@13 deploy --only functions --project zippa-web-official --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
