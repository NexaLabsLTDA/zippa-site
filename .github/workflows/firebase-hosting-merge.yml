# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIPPA_WEB_OFFICIAL }}
          channelId: live
          projectId: zippa-web-official

      # API de Conversões: publica a função e injeta o token da Meta em tempo de deploy.
      # O token vive no segredo do repositório, nunca no código.
      - name: Credencial do Firebase
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIPPA_WEB_OFFICIAL }}' > "$RUNNER_TEMP/sa.json"

      - name: Token da Meta na função
        env:
          CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          if [ -n "$CAPI_TOKEN" ]; then
            printf 'META_CAPI_TOKEN=%s\n' "$CAPI_TOKEN" > functions/.env
            echo "token injetado"
          else
            echo "aviso: segredo META_CAPI_TOKEN ausente — a função sobe sem token"
          fi

      - name: Dependencias da funcao
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Deploy da função de Conversões
        run: npx --yes firebase-tools@13 deploy --only functions --project zippa-web-official --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
